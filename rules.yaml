# Caption rules. Generated by scripts/prepare_data.py from the "Caption rules" sheet.
# Regenerating overwrites this file, so make lasting changes in the spreadsheet.
version: '2026-10-12'
source: QC_Review_Analysis_Jun-Oct_2026.xlsx
rules:
- id: min_words_1
  area: Min words
  rule: Never leave a lone function word ("the", "is") or a fragment on screen for a few frames; merge
    it with the next word/line.
  examples:
  - 'E2CS: the word "the" came for few frames, couple it with another word'
- id: min_words_2
  area: Min words
  rule: Never cut a spoken phrase down to one word; caption the full phrase.
  examples:
  - 'E2CS: "same" -> "in the same direction"'
- id: min_words_3
  area: Min words
  rule: Keep compound phrases together in one caption.
  examples:
  - 'E8C: "hormonal development" should come together'
- id: full_stops_1
  area: Full stops
  rule: No full stop mid-thought when the sentence continues; no capital after it.
  examples:
  - 'E3RK: no full stop after "pretty bad" and no capital word after that'
- id: full_stops_2
  area: Full stops
  rule: Add a full stop at the real end of a sentence.
  examples:
  - 'E8D: full stop after "come from"'
- id: commas_1
  area: Commas
  rule: Do not put a comma after every phrase/line.
  examples:
  - 'E2AB: dont add comma after everything'
- id: commas_2
  area: Commas
  rule: No comma between a verb and its object.
  examples:
  - 'E8D: "it sexy back", dont add comma after sexy'
- id: commas_3
  area: Commas
  rule: Add a comma where speech pauses in a list/clause.
  examples:
  - 'E3RK: comma after "recreational"'
  - 'E3JB: comma before "slurred"'
- id: capitalization_1
  area: Capitalization
  rule: '"I" is always capital.'
  examples:
  - 'E3JB: change lowercase "i" to uppercase "I"'
- id: capitalization_2
  area: Capitalization
  rule: Proper nouns (months, names) and title words are capitalized.
  examples:
  - 'E8C: make "august" and "leo" capital; title "aging" -> "Aging"'
- id: capitalization_3
  area: Capitalization
  rule: No random capitals mid-sentence.
  examples:
  - 'E3RK: do not capitalize "that" / "there"'
  - 'E8D: "realM" m should be small'
- id: verbatim_1
  area: Verbatim
  rule: 'Caption must match the spoken words exactly: no swapped, missing or duplicated words.'
  examples:
  - 'E3JB: "Or," not "Are"'
  - 'E3RK: write "drugs" after "selling"'
  - 'E3JB: delete duplicate "to"'
- id: spelling_1
  area: Spelling
  rule: Every on-screen word spelled correctly, especially names.
  examples:
  - 'E7SS: spelling mistake, its Mark McGwire'
  - 'E2CI: "hourse" -> hours'
- id: numbers_1
  area: Numbers
  rule: Use digits, never a look-alike letter.
  examples:
  - 'E3JB: "O" is a 0'
- id: numbers_2
  area: Numbers
  rule: On-screen numbers animate (count up) when shown as graphics.
  examples:
  - 'E2OCA: numbers need to animate in counting'
- id: spacing_1
  area: Spacing
  rule: One space between words; no glued words.
  examples:
  - 'E3RP: space between "and" and "accountability"'
- id: timing_1
  area: Timing
  rule: Caption must not appear before the word is spoken.
  examples:
  - 'E2JG: "bright" text came early, she hasnt spoken yet'
