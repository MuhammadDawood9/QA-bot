# Video QC Bot configuration.
# Every threshold lives here. Per-client overrides go in clients/<CLIENT>.yaml
# under "overrides:", using the same structure as the "checks:" block below.

# --- Machine-specific settings: edit these when moving between machines ---
machine:
  whisper_model_size: base     # "base" while testing, "small" for real use
  cpu_threads: 4               # faster-whisper threads; set to the MacBook's performance-core count
  ffmpeg_path: null            # null = find "ffmpeg" on PATH; or the full path to the ffmpeg program

paths:
  rules_file: rules.yaml
  clients_dir: clients
  glossary_file: glossary.txt
  extra_words_file: extra_words.txt   # everyday words the spell checker's list is missing
  examples_file: data/examples.csv
  ignore_file: ignore.yaml            # flags you decided are fine (see the file)
  exceptions_file: data/exceptions.yaml
  llm_cache_file: cache/punctuation.json   # cached API answers; delete it to force a fresh review
  transcript_cache_dir: cache/transcripts  # one Whisper transcript per video (by file hash)
  ocr_cache_dir: cache/ocr                 # captions read from each video (by file hash and OCR settings)
  color_cache_dir: cache/color             # color measurements per video
  models_dir: models                       # Whisper models, downloaded on first use

# Frame rate used to convert HH:MM:SS:FF timecodes (e.g. from ClickUp comments) to seconds.
# Semicolon timecodes (HH;MM;SS;FF) are treated as drop-frame at 29.97 (fps 30) or 59.94 (fps 60).
timecode:
  fps: 30

# Reading captions burned into the video (used when no --srt is given).
# A client changes any of these with an "ocr:" block in clients/<CLIENT>.yaml, same keys.
# Regions are fractions of the frame: left/top 0 = left/top edge, width/height 1 = the whole frame.
ocr:
  region: full                 # where captions are: "full" (whole frame) or {left: 0.05, top: 0.65, width: 0.9, height: 0.3}
  ignore_regions: []           # text whose middle is inside one of these is skipped (logos, corner titles)
  ignore_patterns: []          # on-screen text that isn't a caption, as regexes for the whole text, e.g. ['day \d+'] (single quotes keep the \ as typed; a space also matches no space)
  sample_fps: 5                # frames read per second; captions on screen for 1-2 frames need more
  change_threshold: 6.0        # a frame is OCR'd again only if part of the region changed by this much (0-255 grey levels)
  min_box_score: 0.5           # text the OCR is less sure of than this is skipped (fades, motion blur)
  min_single_char_score: 0.8   # a lone letter or digit needs this score (round shapes in the picture read as "O")
  same_text_ratio: 85          # readings this similar (0-100) are the same caption, OCR noise aside
  max_gap_sec: 0.5             # a caption missing from frames for up to this long (animation, flicker) is still one caption
  min_single_frame_score: 0.8  # text seen in only one frame is kept only if read at least this surely
  block_gap_lines: 1.5         # lines further apart than this many line heights are separate texts
  max_caption_sec: 12.0        # text on screen longer than this is a logo or title, not a caption
  screen_text_every_sec: 2.0   # read the whole frame this often for logos and name titles (0 = off)
  det_max_side: 960            # frames are shrunk to this many pixels on the long side for text finding
  cpu_threads: -1              # -1 = all cores
  # Spelling, capitalization, spacing and punctuation flags on a caption the OCR read less surely
  # than this are marked low severity with a note to check the screenshot: it may be the OCR's mistake.
  low_confidence: 0.75
  # The OCR's known weak spots: it drops spaces between words and mixes up commas and full stops
  # even when sure. Flags of these types on OCR captions always get low severity and the note.
  always_doubtful: ["spacing", "punctuation"]

checks:
  too_short:
    enabled: true
    min_words: 2               # fewer words than this = flagged
    min_duration_sec: 0.5      # on screen for less than this = flagged ("came for few frames")
    # One-word captions that are allowed (case and punctuation ignored).
    # Keep words in quotes: unquoted yes / no / on / off are read by YAML as true / false.
    whitelist: ["wow", "yes", "no"]

    phrase_break:
      enabled: true
      # A caption that ends on one of these words leaves the phrase hanging ("...in the").
      dangling_end_words: [
        "a", "an", "the",
        "of", "to", "in", "on", "at", "for", "with", "from", "by", "into", "onto", "about", "as",
        "and", "but", "or", "nor", "so", "because", "if",
        "my", "your", "his", "her", "our", "their", "its",
      ]
      # Short captions with no ending punctuation that run straight into the next caption
      # ("so you even" -> next line). 0 = off. Social-media styles often use 2-3 word captions
      # on purpose, so this is off by default and meant to be switched on per client.
      fragment_max_words: 0
      fragment_max_gap_sec: 0.3

    exceptions:
      last_of_segment: true      # last caption of the file, or followed by a gap >= segment_gap_sec
      segment_gap_sec: 2.0
      whitelist: true            # allow the whitelist above
      isolated_by_gap: true      # gap before OR after >= isolation_gap_sec = intentional pause
      isolation_gap_sec: 1.5
      # Exceptions never excuse a caption that is on screen for less than min_duration_sec.

    suggestion:
      merge_max_gap_sec: 1.0         # only suggest merging with a neighbour this close
      max_merged_duration_sec: 6.0
      max_merged_words: 12

  # Every check also accepts min_confidence: issues below it are dropped (default 0 = keep all).

  spelling:
    enabled: true
    language: en
    max_suggestions: 3
    min_suggestion_frequency: 51   # the word list scores its junk entries 50; never suggest those
    forced_max_distance: 2         # how far a word may be from a forced glossary spelling to be called a misspelling of it
    lookalike_digits: true         # "2O26", "O%": letter O / l / I used as a digit
    repeated_words:
      enabled: true
      across_captions_max_gap_sec: 1.0
      # Doubles that are normal speech or grammar ("that that", "had had", "no no").
      allowed: ["that", "had", "very", "really", "no", "bye", "ha", "haha", "so", "yeah", "go", "knock", "well"]

  capitalization:
    enabled: true
    allow_stylized_lowercase: false   # true for clients who write in all lowercase on purpose (E8D)
    check_mixed_case: true            # "realM", "THe"
    # Always capitalized. "may" and "march" are also common words, so a lowercase one is not flagged.
    proper_nouns: [
      "January", "February", "March", "April", "May", "June", "July", "August",
      "September", "October", "November", "December",
      "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday",
    ]
    ambiguous_lowercase: ["may", "march"]
    mid_sentence_capitals:
      enabled: true
      # Only very common words count ("That", "There"), so names like "Warren" aren't flagged.
      min_word_frequency: 100000
      # Also check the first word of a caption that continues the previous caption's sentence.
      # Off by default: many styles capitalize every caption. Useful for E3RK-style flowing text.
      check_caption_starts: false
      sentence_gap_sec: 2.0          # a pause this long starts a new sentence

  spacing:
    enabled: true
    double_spaces: true
    space_around_punctuation: true    # "foundation,and" and "word ,"
    glued_words:
      enabled: true
      min_part_frequency: 100
      # Words under 3 letters that may be one half of a glued pair ("andaccountability" has "and").
      short_words: ["a", "i", "an", "to", "of", "in", "on", "at", "is", "it", "be", "we", "my", "so",
                    "do", "go", "no", "up", "us", "or", "by", "me", "he", "if", "as", "am"]

  # Punctuation is reviewed by Claude through the Anthropic API. It needs the ANTHROPIC_API_KEY
  # environment variable; without it the check is skipped with a warning and the rest still run.
  # Use --no-llm on the command line to skip it on purpose (no API calls, no cost).
  punctuation:
    enabled: true
    model: claude-sonnet-5-5        # current Sonnet; claude-opus-5-5 is the stronger, pricier option
    effort: low                     # low is the recommended start for classification; raise only if quality needs it
    max_tokens: 16000               # per request; includes the model's thinking, not just the JSON
    fallbacks: default              # if a safety classifier declines, the API retries on a fallback model. null = off
    window_before: 2                # captions of context before the one being reviewed
    window_after: 2                 # and after it
    windows_per_request: 10         # captions reviewed per API call; more = fewer calls, longer replies
    min_confidence: 0.6             # drop answers the model is less sure of than this
    request_timeout_sec: 120
    max_retries: 3                  # the SDK retries rate limits, server errors and network errors
    rule_areas: ["Full stops", "Commas"]     # which rules.yaml areas go into the prompt
    example_categories: ["punctuation"]      # which data/examples.csv rows go into the prompt
    # ...and only rows about punctuation marks (the "punctuation" category also holds capitals and spacing,
    # which the Phase 2 checks already cover).
    example_filter: "comma|full stop|question mark|apostrophe|'s\\b"
    max_examples: 40
    # US dollars per million tokens, only for the cost estimate the CLI prints. Update if prices change.
    price_per_mtok: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.2}

  # Caption text compared with the spoken audio (faster-whisper on the CPU). Runs only when a
  # video is given: python -m src.main --srt captions.srt --video video.mp4
  # Model size and CPU threads are in machine: at the top.
  transcript:
    enabled: true
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
    vad_filter: true                 # skip silence and music, which reduces made-up words
    initial_prompt_max_chars: 600    # glossary terms passed to Whisper (it only reads ~224 tokens)
    window_padding_sec: 1.0          # compare each caption with words spoken from 1 s before to 1 s after it
    min_word_probability: 0.7        # only flag when Whisper heard the word(s) at least this clearly
    same_word_min_ratio: 85          # spellings this similar count as the same word ("hourse"/"hours")
    min_matched_fraction: 0.5        # skip captions where under half the words are heard (titles, on-screen text)
    early_threshold_sec: 0.7         # flag a caption on screen this long before its first word is said
    late_threshold_sec: 0.7          # flag a caption that comes up this long after its first word is said
    late_lookback_sec: 5.0           # how far before a caption to look for its first words when it comes up late
    # Whole-video sync: when every caption is shifted by about the same amount, report it once and
    # compare words with the captions moved back, instead of flagging every caption as late.
    max_offset_sec: 5.0              # largest shift looked for; 0 = off
    sync_threshold_sec: 0.7          # smaller shifts are left to the per-caption early/late checks
    min_sync_match_fraction: 0.4     # at least this share of caption words must line up at the shift
    # Speech with no caption on screen: flagged when it lasts this long AND has this many words.
    uncaptioned_min_sec: 1.5
    uncaptioned_min_words: 4
    uncaptioned_max_pause_sec: 1.5   # a longer pause splits it into separate stretches
    edge_slack_sec: 0.2
    ignore_spoken_repeats: true      # a stutter ("to to") the caption leaves out is not a caption mistake
    # Ignored on both sides. Quoted: some short words are special in YAML.
    fillers: ["um", "umm", "uh", "uhh", "ah", "ahh", "er", "erm", "hmm", "mm", "mhm"]
    # Different ways of writing the same spoken words.
    equivalents: {
      "ok": "okay", "alright": "all right", "gonna": "going to", "wanna": "want to",
      "gotta": "got to", "kinda": "kind of", "sorta": "sort of", "cuz": "because",
      "til": "until", "till": "until", "mr": "mister", "mrs": "missus", "dr": "doctor",
      "vs": "versus", "yall": "you all",
    }

  # Caption words compared with names in the video's own graphics (logo "MAIER", caption "Meyer").
  # Runs when a video is given; the graphics are read by the OCR (ocr.screen_text_every_sec).
  screen_text:
    enabled: true
    min_word_length: 4
    max_edits: 2                 # letters that may differ (1 for words of 4 letters)
    max_term_frequency: 5000     # on-screen words more common than this aren't treated as names
    require_capital: true        # only check capitalized caption words; false for all-lowercase styles

# Color grading, measured shot by shot when a video is given (--no-color to skip).
# A client with a deliberate look changes these in a "color:" block in its client file, e.g.
#   color:
#     skip: ["saturation"]          # this client's grey, desaturated look is intended
color:
  enabled: true
  sample_fps: 4                 # frames looked at per second (cuts are found on every one)
  cut_threshold: 0.35           # color-histogram change (0-1) that counts as a cut between shots
  min_shot_sec: 0.5
  measure_every_n_frames: 1     # brightness and color on every frame of a shot. 2 is faster but can lose
                                # a flag: frames at a shot's edges often belong to the next shot, and with
                                # fewer frames they decide the shot's middle value (burned_box shot 2)
  skin_tones: true              # find faces (YuNet model, downloaded once, 232 KB) and measure skin
  face_every_n_frames: 4        # faces looked for on every 4th frame of a shot (from its first)
  skip: []                      # issue types not to report, e.g. ["saturation", "color_cast"]
  # Flags on one shot. Brightness values are 0-255; color values are Lab (neutral = 0).
  clipped_white: 0.04           # share of pure white pixels that counts as overexposed (2.5x = high)
  clipped_black: 0.15           # share of pure black pixels that counts as crushed
  dark_median: 40               # too dark: middle brightness below this...
  dark_white_level: 200         # ...and even the brightest parts below this
  lifted_black_level: 40        # darkest 2% brighter than this = lifted, washed-out blacks
  min_tonal_range: 120          # brightest minus darkest below this = flat
  dull_chroma: 6                # mean saturation below this = almost grey
  oversaturated_chroma: 40
  cast_strength: 6              # tint of whites and greys that counts as a color cast
  skin_hue_range: [20, 70]      # natural skin hue, degrees (Lab); below = pink/magenta, above = yellow/green
  skin_min_chroma: 9
  skin_max_chroma: 38
  # Shots that don't match
  mismatch_min_shot_sec: 1.0    # shorter shots aren't compared
  skin_hue_jump: 12             # skin hue change between consecutive shots with faces, degrees
  mismatch_cast: 8              # tint difference from the video's typical shot
  mismatch_chroma: 12           # saturation difference from the video's typical shot

# The QC report (python -m src.main ... --report).
report:
  output_dir: reports                # one new folder per run: reports/<name>_<date-time>/
  formats: ["md", "docx"]            # md = report.md, docx = report.docx (Word); same content in both
  page_size: a4                      # Word page size: a4 or letter
  include_screenshots: true          # needs --video and ffmpeg
  screenshot_at: middle              # middle or start of the caption; middle shows burned-in text fully
  screenshot_width: 640              # pixels
  write_csv: true                    # issues.csv for Excel or a ClickUp import
