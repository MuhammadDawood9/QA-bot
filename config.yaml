# Video QC Bot configuration.
# Every threshold lives here. Per-client overrides go in clients/<CLIENT>.yaml
# under "overrides:", using the same structure as the "checks:" block below.

# --- Machine-specific settings ---
# On the QC floor this block is read from the app's own config.yaml and each PC's local.yaml
# (Settings > Speech model) only; a machine: block in the SHARED config.yaml is ignored, because
# ffmpeg_path names a program every PC would run.
machine:
  whisper_model_size: auto     # auto = picked from the CPU and memory (base under 4 cores or 8 GB, else small);
                               # or tiny / base / small / medium
  cpu_threads: auto            # auto = half the cores, so editing on the same PC stays smooth; or a number
  ffmpeg_path: null            # null = find "ffmpeg" on PATH; or the full path to the ffmpeg program
  ffmpeg_timeout_sec: 900      # one ffmpeg call (audio of a whole video, a frame, a clip) is stopped after this
                               # long, so a damaged video can't hang the check; null or 0 = no limit

paths:
  rules_file: rules.yaml
  clients_dir: clients
  glossary_file: glossary.txt
  extra_words_file: extra_words.txt   # everyday words the spell checker's list is missing
  examples_file: data/examples.csv
  ignore_file: ignore.yaml            # flags you decided are fine (see the file)
  color_file: color.yaml              # color grading thresholds and per-client color overrides
  backups_dir: backups                # previous versions of client files and color.yaml, one per save
  changelog_file: changelog.csv       # who changed which client file, when, from which PC
  exceptions_file: data/exceptions.yaml
  llm_cache_file: cache/punctuation.json   # cached API answers; delete it to force a fresh review
  transcript_cache_dir: cache/transcripts  # one Whisper transcript per video (by file hash)
  ocr_cache_dir: cache/ocr                 # captions read from each video (by file hash and OCR settings)
  color_cache_dir: cache/color             # color measurements per video
  frames_cache_dir: cache/frames           # the delivery checks' per-frame measurements per video
  models_dir: models                       # Whisper models, downloaded on first use

# Frame rate used to convert HH:MM:SS:FF timecodes (e.g. from ClickUp comments) to seconds.
# Semicolon timecodes (HH;MM;SS;FF) are treated as drop-frame at 29.97 (fps 30) or 59.94 (fps 60).
timecode:
  fps: 30

# Reading captions burned into the video (used when no --srt is given).
# A client changes any of these with an "ocr:" block in clients/<CLIENT>.yaml, same keys.
# Regions are fractions of the frame: left/top 0 = left/top edge, width/height 1 = the whole frame.
ocr:
  region: full                 # where captions are: "full" (whole frame) or {left: 0.05, top: 0.65, width: 0.9, height: 0.3}
  ignore_regions: []           # text whose middle is inside one of these is skipped (logos, corner titles)
  ignore_patterns: []          # on-screen text that isn't a caption, as regexes for the whole text, e.g. ['day \d+'] (single quotes keep the \ as typed; a space also matches no space)
  sample_fps: 5                # frames read per second; captions on screen for 1-2 frames need more
  change_threshold: 6.0        # a frame is OCR'd again only if part of the region changed by this much (0-255 grey levels)
  min_box_score: 0.5           # text the OCR is less sure of than this is skipped (fades, motion blur)
  min_single_char_score: 0.8   # a lone letter or digit needs this score (round shapes in the picture read as "O")
  same_text_ratio: 85          # readings this similar (0-100) are the same caption, OCR noise aside
  max_gap_sec: 0.5             # a caption missing from frames for up to this long (animation, flicker) is still one caption
  min_single_frame_score: 0.8  # text seen in only one frame is kept only if read at least this surely
  block_gap_lines: 1.5         # lines further apart than this many line heights are separate texts
  max_caption_sec: 12.0        # text on screen longer than this is a logo or title, not a caption
  screen_text_every_sec: 2.0   # read the whole frame this often for logos and name titles (0 = off)
  det_max_side: 960            # frames are shrunk to this many pixels on the long side for text finding
  cpu_threads: auto            # auto = half the cores (gentle on shared PCs); -1 = all cores
  # Spelling, capitalization, spacing and punctuation flags on a caption the OCR read less surely
  # than this are marked low severity with a note to check the screenshot: it may be the OCR's mistake.
  low_confidence: 0.75
  # The OCR's known weak spots: it drops spaces between words and mixes up commas and full stops
  # even when sure. Flags of these types on OCR captions always get low severity and the note.
  always_doubtful: ["spacing", "punctuation"]

checks:
  too_short:
    enabled: true
    min_words: 2               # fewer words than this = flagged
    min_duration_sec: 0.5      # on screen for less than this = flagged ("came for few frames")
    # One-word captions that are allowed (case and punctuation ignored).
    # Keep words in quotes: unquoted yes / no / on / off are read by YAML as true / false.
    whitelist: ["wow", "yes", "no"]

    phrase_break:
      enabled: true
      # A caption that ends on one of these words leaves the phrase hanging ("...in the").
      dangling_end_words: [
        "a", "an", "the",
        "of", "to", "in", "on", "at", "for", "with", "from", "by", "into", "onto", "about", "as",
        "and", "but", "or", "nor", "so", "because", "if",
        "my", "your", "his", "her", "our", "their", "its",
      ]
      # Short captions with no ending punctuation that run straight into the next caption
      # ("so you even" -> next line). 0 = off. Social-media styles often use 2-3 word captions
      # on purpose, so this is off by default and meant to be switched on per client.
      fragment_max_words: 0
      fragment_max_gap_sec: 0.3

    exceptions:
      last_of_segment: true      # last caption of the file, or followed by a gap >= segment_gap_sec
      segment_gap_sec: 2.0
      whitelist: true            # allow the whitelist above
      isolated_by_gap: true      # gap before OR after >= isolation_gap_sec = intentional pause
      isolation_gap_sec: 1.5
      # Exceptions never excuse a caption that is on screen for less than min_duration_sec.

    suggestion:
      merge_max_gap_sec: 1.0         # only suggest merging with a neighbour this close
      max_merged_duration_sec: 6.0
      max_merged_words: 12

  # Every check also accepts min_confidence: issues below it are dropped (default 0 = keep all).

  spelling:
    enabled: true
    language: en
    max_suggestions: 3
    min_suggestion_frequency: 51   # the word list scores its junk entries 50; never suggest those
    forced_max_distance: 2         # how far a word may be from a forced glossary spelling to be called a misspelling of it
    lookalike_digits: true         # "2O26", "O%": letter O / l / I used as a digit
    repeated_words:
      enabled: true
      across_captions_max_gap_sec: 1.0
      # Doubles that are normal speech or grammar ("that that", "had had", "no no").
      allowed: ["that", "had", "very", "really", "no", "bye", "ha", "haha", "so", "yeah", "go", "knock", "well"]

  capitalization:
    enabled: true
    allow_stylized_lowercase: false   # true for clients who write in all lowercase on purpose (E8D)
    check_mixed_case: true            # "realM", "THe"
    # Always capitalized. "may" and "march" are also common words, so a lowercase one is not flagged.
    proper_nouns: [
      "January", "February", "March", "April", "May", "June", "July", "August",
      "September", "October", "November", "December",
      "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday",
    ]
    ambiguous_lowercase: ["may", "march"]
    mid_sentence_capitals:
      enabled: true
      # Only very common words count ("That", "There"), so names like "Warren" aren't flagged.
      min_word_frequency: 100000
      # Also check the first word of a caption that continues the previous caption's sentence.
      # Off by default: many styles capitalize every caption. Useful for E3RK-style flowing text.
      check_caption_starts: false
      sentence_gap_sec: 2.0          # a pause this long starts a new sentence

  spacing:
    enabled: true
    double_spaces: true
    space_around_punctuation: true    # "foundation,and" and "word ,"
    glued_words:
      enabled: true
      min_part_frequency: 100
      # Words under 3 letters that may be one half of a glued pair ("andaccountability" has "and").
      short_words: ["a", "i", "an", "to", "of", "in", "on", "at", "is", "it", "be", "we", "my", "so",
                    "do", "go", "no", "up", "us", "or", "by", "me", "he", "if", "as", "am"]

  # Punctuation reviewed by Claude through the Anthropic API. OFF by default: the normal flow needs
  # no API key and no network, so the bot runs fully offline once set up. While it is off it is
  # hidden from the app's Checks menu and left out of reports and summaries. To use it, an admin
  # sets enabled: true here and sets the ANTHROPIC_API_KEY environment variable on that PC (never
  # in a file that's shared or installed); without the key it is skipped with a warning.
  # --no-llm on the command line skips it for one run.
  punctuation:
    enabled: false
    model: claude-sonnet-5-5        # current Sonnet; claude-opus-5-5 is the stronger, pricier option
    effort: low                     # low is the recommended start for classification; raise only if quality needs it
    max_tokens: 16000               # per request; includes the model's thinking, not just the JSON
    fallbacks: default              # if a safety classifier declines, the API retries on a fallback model. null = off
    window_before: 2                # captions of context before the one being reviewed
    window_after: 2                 # and after it
    windows_per_request: 10         # captions reviewed per API call; more = fewer calls, longer replies
    min_confidence: 0.6             # drop answers the model is less sure of than this
    request_timeout_sec: 120
    max_retries: 3                  # the SDK retries rate limits, server errors and network errors
    rule_areas: ["Full stops", "Commas"]     # which rules.yaml areas go into the prompt
    example_categories: ["punctuation"]      # which data/examples.csv rows go into the prompt
    # ...and only rows about punctuation marks (the "punctuation" category also holds capitals and spacing,
    # which the Phase 2 checks already cover).
    example_filter: "comma|full stop|question mark|apostrophe|'s\\b"
    max_examples: 40
    # US dollars per million tokens, only for the cost estimate the CLI prints. Update if prices change.
    price_per_mtok: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.2}

  # Caption text compared with the spoken audio (faster-whisper on the CPU). Runs only when a
  # video is given: python -m src.main --srt captions.srt --video video.mp4
  # Model size and CPU threads are in machine: at the top.
  transcript:
    enabled: true
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
    vad_filter: true                 # skip silence and music, which reduces made-up words
    initial_prompt_max_chars: 600    # glossary terms passed to Whisper (it only reads ~224 tokens)
    window_padding_sec: 1.0          # compare each caption with words spoken from 1 s before to 1 s after it
    min_word_probability: 0.7        # only flag when Whisper heard the word(s) at least this clearly
    same_word_min_ratio: 85          # spellings this similar count as the same word ("hourse"/"hours")
    min_matched_fraction: 0.5        # skip captions where under half the words are heard (titles, on-screen text)
    early_threshold_sec: 0.7         # flag a caption on screen this long before its first word is said
    late_threshold_sec: 0.7          # flag a caption that comes up this long after its first word is said
    late_lookback_sec: 5.0           # how far before a caption to look for its first words when it comes up late
    # Whole-video sync: when every caption is shifted by about the same amount, report it once and
    # compare words with the captions moved back, instead of flagging every caption as late.
    max_offset_sec: 5.0              # largest shift looked for; 0 = off
    sync_threshold_sec: 0.7          # smaller shifts are left to the per-caption early/late checks
    min_sync_match_fraction: 0.4     # at least this share of caption words must line up at the shift
    # Speech with no caption on screen: flagged when it lasts this long AND has this many words.
    uncaptioned_min_sec: 1.5
    uncaptioned_min_words: 4
    uncaptioned_max_pause_sec: 1.5   # a longer pause splits it into separate stretches
    edge_slack_sec: 0.2
    ignore_spoken_repeats: true      # a stutter ("to to") the caption leaves out is not a caption mistake
    # Not enough speech to compare captions with (a clip that is mostly music, a silent track, or no
    # audio at all): the caption-vs-audio checks skip themselves and the report says why - never an
    # error. A client changes any of these with an "overrides:" block in its client file.
    min_words: 10                    # fewer transcribed words than this in the whole audio, or...
    min_speech_coverage: 0.05        # ...speech covering under this share of the audio (0.05 = 5%), or...
    min_mean_word_probability: 0.5   # ...words Whisper wasn't this sure of on average (guesses over music), or...
    no_speech_probability: 0.6       # ...Whisper's own segments this sure a stretch has no speech, over...
    no_speech_share: 0.5             # ...this share of the audio: music or noise, not speech.
    # Ignored on both sides. Quoted: some short words are special in YAML.
    fillers: ["um", "umm", "uh", "uhh", "ah", "ahh", "er", "erm", "hmm", "mm", "mhm"]
    # Different ways of writing the same spoken words.
    equivalents: {
      "ok": "okay", "alright": "all right", "gonna": "going to", "wanna": "want to",
      "gotta": "got to", "kinda": "kind of", "sorta": "sort of", "cuz": "because",
      "til": "until", "till": "until", "mr": "mister", "mrs": "missus", "dr": "doctor",
      "vs": "versus", "yall": "you all",
    }

  # Caption words compared with names in the video's own graphics (logo "MAIER", caption "Meyer").
  # Runs when a video is given; the graphics are read by the OCR (ocr.screen_text_every_sec).
  screen_text:
    enabled: true
    min_word_length: 4
    max_edits: 2                 # letters that may differ (1 for words of 4 letters)
    max_term_frequency: 5000     # on-screen words more common than this aren't treated as names
    require_capital: true        # only check capitalized caption words; false for all-lowercase styles

# Audio-edit checks for podcasts (src/audio/edits.py): stutters and repeats, retakes left in, abrupt
# and jump cuts, dead air, fillers. A client switches them on and sets every value in an "audio:"
# block in its client file (clients/E2CL.yaml has the complete, commented set); these are the
# defaults. Audio files (mp3, wav, m4a, aac, flac, ogg) skip every picture check.
audio:
  enabled: auto                  # auto = on for audio files, off for videos; true = also on videos; false = never
  sensitivity: medium            # low (fewer, surer flags) / medium / high (more flags, more false alarms)
  checks:                        # which audio checks run
    stutter: true                # a word or sound said twice in a row, false starts ("I wa- I wanted")
    repeated_phrase: true        # a 2-3 word phrase said twice in a row
    repeated_take: true          # the same sentence said again within take_window_sec (a retake left in)
    abrupt_cut: true             # clicks, speech stopping dead, words cut off mid-word
    jump_cut: true               # room tone or loudness changing at an edit, a pause cut out
    dead_air: true               # silence longer than dead_air_sec
    fillers: false               # flag every um / uh (they're always counted in the report's checks list)
  sample_rate: 16000             # the audio is analysed at this rate (Hz)
  # Whisper is asked to write disfluencies down (it tends to tidy them away): a prompt full of
  # them, and no carrying of the previous sentence's style. It still drops some, which is why
  # the sound itself is compared too.
  disfluency_prompt: "Umm, let me think like, hmm... Okay, here's what I'm, like, thinking. I- I wa- I wanted to, uh, say"
  condition_on_previous_text: false
  whisper_vad: false             # with the prompt, the voice filter made Whisper drop whole 20 s stretches
  transcript_gap_sec: 5          # speech this long with no words in the transcript is filled from a plain pass
  # Repeats that are normal speech, not mistakes (case and punctuation ignored).
  legit_repeats: ["very very", "no no", "yeah yeah", "yes yes", "bye bye", "so so", "that that", "had had",
                  "really really", "ha ha", "haha haha", "knock knock", "go go", "well well", "now now",
                  "okay okay", "ok ok", "right right", "hey hey", "is is", "blah blah", "more more", "again and again"]
  fillers: ["um", "umm", "uh", "uhh", "ah", "ahh", "er", "erm", "hmm", "mm", "mhm"]
  max_repeat_gap_sec: 1.0        # the two words of a repeat are at most this far apart
  max_phrase_words: 3            # longest phrase checked for an immediate repeat
  restart_max_prob: 0.8          # "rate rates" is a stutter only if Whisper was less sure than this of "rate"
  take_min_words: 5              # a retake is at least this many words said again...
  take_window_sec: 30            # ...within this many seconds
  acoustic_unit_ms: [150, 800]   # length of the repeated sound looked for (shortest, longest)
  acoustic_margin: 0.2           # a repeat must be this much less alike at half its length (not a held vowel)
  acoustic_min_speech: 0.6       # share of the stretch that must be speech (a stutter has a pause inside)
  acoustic_max_level_diff_db: 6  # the two copies' loudness may differ by at most this
  acoustic_onset_db: 6           # each copy must start with a sound starting (a rise of this many dB)
  speech_above_floor_db: 15      # a frame this far above the local noise floor is speech
  speech_min_db: -50             # ...and at least this loud (dBFS)
  digital_silence_db: -85        # quieter than this is digital silence (not room tone)
  min_fade_ms: 30                # natural speech fades out over longer than this
  abrupt_drop_db: 30             # speech dropping this much within ~20 ms has no fade
  click_min_jump: 0.05           # a click: one sample jumps at least this much (full scale = 1)...
  room_tone_window_sec: 3.0      # background compared over this long before / after a point
  room_tone_shape_db: 5          # background spectrum shape change counted as a different room
  min_room_tone_sec: 0.4         # pauses needed on each side to judge the room tone (dips inside speech aren't)
  loudness_window_sec: 2.5       # speech level compared over this long before / after a point
  cut_word_max_sec: 0.3          # a word this short...
  cut_word_max_prob: 0.5         # ...that Whisper is this unsure of, still loud at its end, is cut off
  jump_max_similarity: 0.35      # where two words touch, timbre this unlike across 20 ms is a splice
  min_sentence_gap_sec: 0.08     # a sentence boundary with less pause than this lost its breath
  pause_min_sec: 0.15            # pauses at least this long are checked for background / loudness changes
  cut_merge_sec: 0.3             # evidence this close together is one cut
  # How much each kind of evidence counts toward a cut's score (0-1); scores combine like
  # independent chances: 1 - (1 - a)(1 - b)...
  weight_click: 0.6
  weight_edge: 0.7
  weight_cut_word: 0.5
  weight_spectral_jump: 0.4
  weight_short_gap: 0.35
  weight_room_tone: 0.75
  weight_loudness: 0.6
  dead_stop_db: 12               # a cut-off word that falls this much within ~10 ms "stops dead" (stronger evidence)
  # --- Mixed, multi-speaker episodes: what to leave alone (src/audio/regions.py) ---
  suppression: true              # false = find the regions but hide nothing (only to measure what suppression changes)
  voice_pitch_semitones: 3.5     # two occurrences of a word this far apart in pitch are two people: not a stutter
  voice_min_similarity: 0.35     # ...or the same word sounding this unlike itself (timbre)
  turn_pitch_semitones: 5        # a change of speaker: the typical pitch of the stretch before and after differs this much
  turn_window_sec: 1.2           # ...each stretch this long
  overlap_collision_sec: 0.08    # crosstalk signs: word times overlapping by this much...
  overlap_low_prob: 0.45         # ...a run of words Whisper is this unsure of...
  overlap_low_prob_run: 3        # ...this many in a row...
  overlap_energy_rise_db: 6      # ...or speech this much louder than usual with a flatter spectrum (two signs needed)
  music_word_min_prob: 0.6       # words over music less sure than this are dropped (Whisper writes "lyrics")
  music_no_speech_prob: 0.6      # Whisper segments this sure there's no speech, while not silent, count as music
  music_min_above_floor_db: 15   # music: energy this far above the room tone...
  music_tonal_flatness: 0.12     # ...and tonal (spectral flatness under this)...
  music_beat_strength: 0.45      # ...or with a beat this regular...
  music_max_dips: 0.15           # ...or steady (fewer syllable-like dips than this share)
  music_min_sec: 1.5             # shortest music region
  bed_min_above_floor_db: 12     # a bed under speech: pauses between words this far above the room tone,
  bed_min_pause_sec: 0.09        #   at least this long,
  bed_min_pauses: 3              #   at least this many in a row (within 4 s of each other),
  bed_same_shape_db: 4           #   each sounding like the last (spectral shape and
  bed_same_level_db: 6           #   level within these): another voice bleeding in doesn't
  sfx_rise_db: 15                # an effect: a rise this sharp, outside any word...
  sfx_decay_db: 15               # ...falling this much within 0.4 s
  cue_match_threshold: 0.6       # a reference cue matches where the band-energy correlation is at least this
  min_confidence: 0.0            # drop audio flags less sure than this
  # The values the sensitivity chooses between.
  levels:
    low:
      acoustic_similarity: 0.98  # how alike two stretches must sound to be a repeated sound (0-1)
      take_acoustic_similarity: 0.85
      click_ratio: 12            # a click jumps this many times more than the signal around it
      room_tone_db: 8            # background level change counted as a different room
      loudness_jump_db: 8        # speech level change at an edit
      cut_score: 0.8             # combined evidence needed to flag a cut
      dead_air_sec: 3.5          # silence longer than this is dead air
    medium:
      acoustic_similarity: 0.955
      take_acoustic_similarity: 0.75
      click_ratio: 9
      room_tone_db: 6
      loudness_jump_db: 6
      cut_score: 0.65
      dead_air_sec: 2.5
    high:
      acoustic_similarity: 0.93
      take_acoustic_similarity: 0.65
      click_ratio: 7
      room_tone_db: 4.5
      loudness_jump_db: 4.5
      cut_score: 0.5
      dead_air_sec: 1.8
  silence_noise_db: -60          # quieter than this (20 ms level, dBFS) is always silence...
  silence_above_floor_db: 8      # ...and so is anything less than this above the local room tone

# Where a client's music and sound effects are allowed (podcasts). A client sets its own in an
# "audio_guidelines:" block in its client file (or in Add / Edit client > Audio guidelines).
audio_guidelines:
  # Music the guidelines allow is never flagged: intro, outro, transitions, ad_breaks, under_speech (beds).
  # Music found somewhere not allowed (a bed when under_speech is missing) is listed but checked like speech.
  music_allowed: [intro, outro, transitions, ad_breaks, under_speech]
  sfx_allowed: [transitions, stingers, emphasis]      # empty = effects aren't expected: hits are checked like speech
  reference_folder: null         # the client's stingers, jingles, beds and effects (a folder; relative = in the data folder)
  sensitivity: normal            # strict / normal / lenient: ignore 0.15 / 0.3 / 0.6 s around each music or effect
                                 # region; lenient also recognizes music more readily
  required_cues:                 # optional check, off: report a required cue that isn't there
    enabled: false
    cues: []                     # e.g. {reference: intro_stinger.wav, at: start, within_sec: 30}
                                 #      {reference: outro_music.wav, at: end, within_sec: 60}

# Color grading, measured shot by shot when a video is given (--no-color to skip). Every color
# threshold, with what it means, and the per-client overrides (including each client's skip list)
# are in color.yaml (paths.color_file).

# Technical delivery checks (src/delivery/): the exported file itself, not what's in it. A client
# sets what it ordered in a "delivery:" block in its client file, same keys (e.g. spec: {aspect:
# "9:16", max_duration_sec: 60} for reels). --no-delivery on the command line skips them for one run.
delivery:
  enabled: true
  spec:                            # what the client ordered; null = anything is fine
    width: null                    # pixels, e.g. 1080
    height: null                   # pixels, e.g. 1920
    aspect: null                   # "9:16", "16:9", "1:1", "4:5" (the picture as shown, pixel aspect included)
    aspect_tolerance: 0.01         # share the picture's aspect may differ from it
    fps: null                      # one number or a list, e.g. [23.976, 24, 25, 29.97, 30]
    fps_tolerance: 0.01            # share the frame rate may differ from one of them
    min_duration_sec: null
    max_duration_sec: null         # e.g. 60 for a reel
    min_video_kbps: null           # below this the export is probably over-compressed (e.g. 8000 for 1080p)
    audio_sample_rate: null        # e.g. 48000
    audio_channels: null           # 1 = mono, 2 = stereo
  loudness:                        # measured over the whole file (EBU R128, ffmpeg's loudnorm analysis)
    enabled: true
    target_lufs: -14.0             # integrated loudness: -14 YouTube / Spotify / TikTok / Instagram,
                                   # -16 Apple Podcasts, -23 broadcast (EBU R128); null = not checked
    tolerance_lu: 2.0              # flagged when further than this from the target
    max_true_peak_dbtp: -1.0       # true peak above this distorts after the platform re-encodes; null = not checked
  clipping:
    enabled: true
    level: 0.999                   # a sample at or above this (1.0 = full scale) counts as clipped
    min_run_samples: 3             # this many clipped samples in a row in one channel = a clip (one alone is a peak)
    merge_gap_sec: 1.0             # clips closer than this are one flag
    max_flags: 10                  # the regions with the most clips; the rest are counted in the summary
  voice_under_music:               # needs the speech transcript (checks.transcript, or the audio checks' own)
    # EXPERIMENTAL, off by default: on a real two-person podcast the gaps between Whisper's words
    # often hold the other speaker or the tail of a word, so it flagged clean speech about once a
    # minute. Switch it on per client (delivery: {voice_under_music: {enabled: true}}) and check
    # its flags with scripts/evaluate.py before trusting it.
    enabled: false
    window_sec: 5.0                # judged in windows this long
    min_speech_sec: 1.0            # a window needs this much speech ...
    min_gap_sec: 0.25              # ... and pauses between words at least this long ...
    gap_margin_sec: 0.05           # (trimmed by this much at each end: word times are approximate)
    min_background_sec: 0.4        # ... adding up to this much, to hear what's under the voice
    min_voice_over_background_db: 6.0   # speech louder than the pauses around it by less than this = voice buried
    quiet_background_db: -45.0     # pauses quieter than this (dBFS) have nothing to bury the voice: not flagged
    merge_gap_sec: 2.0             # flagged windows this close are one flag
    sample_rate: 16000             # the audio is measured at this rate (Hz)
  picture:                         # every frame, shrunk and grey, during the one read of the video
    enabled: true
    analysis_width: 64             # pixels wide (changing it re-reads cached videos)
    black_pixel_luma: 24           # a pixel this dark or darker (0-255) is black ...
    black_share: 0.98              # ... and a frame with this share of black pixels is a black frame
    min_black_sec: 0.1             # black this long is flagged ...
    edge_black_sec: 1.0            # ... except at the very start or end, where up to this long is a fade
    freeze_diff: 0.15              # mean change between frames (0-255 grey levels) below this = the same picture
    min_freeze_sec: 2.0            # a picture frozen this long is flagged (raise it for clients with still slides)
    flash_diff: 40.0               # frames this different from the frame before and after them ...
    flash_neighbour_diff: 12.0     # ... where those two are this alike = a flash frame (a stray frame at a cut)
    max_flash_frames: 2            # up to this many frames in a row (at most 3)
  safe_area:                       # burned-in captions (OCR) under a platform's buttons; SRT captions have no position
    enabled: auto                  # auto = vertical videos only (taller than wide); true; false
    min_overlap: 0.1               # share of the caption's box inside a zone to flag it
    zones:                         # fractions of the frame; roughly TikTok / Reels / Shorts, adjust per client
      - {name: "bottom bar (caption and username)", left: 0.0, top: 0.80, width: 1.0, height: 0.20}
      - {name: "right buttons (like, comment, share)", left: 0.84, top: 0.35, width: 0.16, height: 0.48}
      - {name: "top bar", left: 0.0, top: 0.0, width: 1.0, height: 0.08}

# The QC report (python -m src.main ... --report).
report:
  output_dir: reports                # one new folder per run: reports/<name>_<date-time>/
  formats: ["md", "docx"]            # md = report.md, docx = report.docx (Word); same content in both
  page_size: a4                      # Word page size: a4 or letter
  include_screenshots: true          # needs --video and ffmpeg
  screenshot_at: middle              # middle or start of the caption; middle shows burned-in text fully
  screenshot_width: 640              # pixels
  write_csv: true                    # issues.csv for Excel or a ClickUp import
