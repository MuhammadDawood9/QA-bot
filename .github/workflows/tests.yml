# The tests on Windows and on an Intel Mac (where the bot runs), on every push.
#
# What can't run here (client data in data/, the Whisper model, real QC videos) skips itself;
# the slow tests (--run-slow) stay on your machine. Qt runs headless (offscreen).
#
# Cost: on a private repository GitHub counts each macOS minute as 10 against the free minutes,
# so macOS runs only for main (and when started by hand: Actions -> Tests -> Run workflow).

name: Tests

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:                       # a newer push cancels the run still going for the same branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows always; the Intel Mac only for main or a run started by hand (see Cost above).
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
              && '["windows-latest", "macos-15-intel"]' || '["windows-latest"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install the Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q -rs
