# Client rules for E3RP. Generated by scripts/prepare_data.py from the "Client rules" sheet.
# "client", "project" and "notes" are rewritten on every run. Everything else is yours
# and is kept when this file is regenerated:
#   glossary:   extra glossary.txt lines for this client only, e.g. ["=Mark McGwire"]
#   overrides:  same structure as "checks:" in config.yaml, e.g.
#                 too_short:
#                   min_words: 3
#   ocr:        where this client's burned-in captions are; same keys as "ocr:" in config.yaml, e.g.
#                 region: {left: 0.05, top: 0.68, width: 0.9, height: 0.27}
#                 ignore_patterns: ['day \d+']
client: E3RP
project: animated videos
notes: Text speed and word spacing checked repeatedly.
overrides: {}

# What this client orders (delivery checks, src/delivery/; every key is in config.yaml "delivery:").
delivery:
  spec:
    aspect: "16:9"               # horizontal videos; any length
  loudness:
    target_lufs: -14.0           # YouTube / web
