# Client rules for E3RK. Generated by scripts/prepare_data.py from the "Client rules" sheet.
# "client", "project" and "notes" are rewritten on every run. Everything else is yours
# and is kept when this file is regenerated:
#   glossary:   extra glossary.txt lines for this client only, e.g. ["=Mark McGwire"]
#   overrides:  same structure as "checks:" in config.yaml, e.g.
#                 too_short:
#                   min_words: 3
#   ocr:        where this client's burned-in captions are; same keys as "ocr:" in config.yaml, e.g.
#                 region: {left: 0.05, top: 0.68, width: 0.9, height: 0.27}
#                 ignore_patterns: ['day \d+']
client: E3RK
project: My Criminal Life Lead Me to Christ reels
notes: 'Flowing sentences: fewer full stops, no capital after them; text placed just below the chin.'
overrides:
  punctuation_style:
    full_stops: never              # flowing sentences: "no full stop after 'there it was'"
ocr:
  region: full                     # text sits just below the speaker's chin and moves with them

# What this client orders (delivery checks, src/delivery/; every key is in config.yaml "delivery:").
delivery:
  spec:
    aspect: "9:16"               # vertical reels; any length
  loudness:
    target_lufs: -14.0           # social media / YouTube
